<section aria-labelledby="model-heading"><h2 id="model-heading">Модель по умолчанию</h2>
<p id="current-model" role="status"></p>
<p>Выбор действует со следующего сообщения для всех пользователей, включая выбравших модель ранее.</p>
<button id="refresh-models" type="button">Запросить модели</button>
<form id="default-model" hidden><label>Модель<select name="model" required></select></label>
<label>Рассуждение<select name="effort" required></select></label>
<button type="submit">Установить по умолчанию</button></form>
<p id="model-status" role="status" aria-live="polite"></p></section>
