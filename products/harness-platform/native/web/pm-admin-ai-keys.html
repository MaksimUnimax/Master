<section class="pm-ai" data-pm-ai-admin="keys" aria-labelledby="pm-ai-keys-heading">
  <h2 id="pm-ai-keys-heading">Ключи моделей</h2>
  <p>Ключи сохраняются на сервере и не показываются повторно.</p>
  <form data-ai="provider-key" data-provider="deepseek"><label>Ключ DeepSeek<input name="key" type="password" autocomplete="new-password" maxlength="2048" required></label><button type="submit">Сохранить ключ DeepSeek</button><p data-ai="key-state-deepseek"></p></form>
  <form data-ai="provider-key" data-provider="openrouter"><label>Ключ OpenRouter<input name="key" type="password" autocomplete="new-password" maxlength="2048" required></label><button type="submit">Сохранить ключ OpenRouter</button><p data-ai="key-state-openrouter"></p></form>
  <p data-ai="status" role="status" aria-live="polite"></p>
</section>
