# Domain preparation only. Never expose account or API traffic over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name mastersckaya.ru www.mastersckaya.ru;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/podmasterye-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        return 503 "Mastersckaya: HTTPS setup pending.\n";
    }
}
